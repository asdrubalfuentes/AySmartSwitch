<svg viewBox="0 0 1010 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <title>aySmartSwitch con ESP32-C3 SuperMini: control de apertura de puerta o portón</title>
  <desc>Esquema de conexión: fuente de 5 V, ESP32-C3 SuperMini, módulo de relé en paralelo con el pulsador del portón y sensor magnético de estado.</desc>
  <rect width="1010" height="660" fill="#ffffff"/>
  <text x="505" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#14313C">aySmartSwitch · ESP32-C3 SuperMini · apertura de puerta / portón</text>

  <!-- ===== Fuente 5 V ===== -->
  <rect x="30" y="90" width="150" height="100" rx="8" fill="#eef3f2" stroke="#14313C" stroke-width="2"/>
  <text x="105" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#14313C">Fuente 5 V</text>
  <text x="105" y="136" text-anchor="middle" font-size="11" fill="#14313C">cargador USB ≥ 1 A</text>
  <text x="105" y="152" text-anchor="middle" font-size="11" fill="#14313C">(o módulo HLK-PM01)</text>
  <circle cx="180" cy="115" r="5" fill="#d32f2f"/><text x="170" y="119" text-anchor="end" font-size="12" font-weight="700" fill="#d32f2f">+5V</text>
  <circle cx="180" cy="165" r="5" fill="#222"/><text x="170" y="169" text-anchor="end" font-size="12" font-weight="700" fill="#222">GND</text>

  <!-- ===== ESP32-C3 SuperMini ===== -->
  <rect x="360" y="80" width="200" height="330" rx="12" fill="#e6f0ff" stroke="#14313C" stroke-width="2.5"/>
  <text x="460" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#14313C">ESP32-C3 SuperMini</text>
  <rect x="425" y="116" width="70" height="22" rx="4" fill="#c9d3e0" stroke="#14313C"/><text x="460" y="131" text-anchor="middle" font-size="11" fill="#14313C">USB-C</text>
  <text x="460" y="372" text-anchor="middle" font-size="10" fill="#14313C">LED azul = GPIO8 · botón BOOT = GPIO9</text>
  <text x="460" y="388" text-anchor="middle" font-size="10" fill="#14313C">BOOT: 3 s = portal WiFi · 10 s = restaurar</text>
  <!-- pines izquierda -->
  <circle cx="360" cy="115" r="5" fill="#d32f2f"/><text x="372" y="119" font-size="13" font-weight="700" fill="#14313C">5V</text>
  <circle cx="360" cy="165" r="5" fill="#222"/><text x="372" y="169" font-size="13" font-weight="700" fill="#14313C">GND</text>
  <circle cx="360" cy="260" r="5" fill="#1565c0"/><text x="372" y="264" font-size="13" font-weight="700" fill="#14313C">3V3</text>
  <!-- pines derecha -->
  <circle cx="560" cy="195" r="5" fill="#ef6c00"/><text x="548" y="199" text-anchor="end" font-size="13" font-weight="700" fill="#14313C">GPIO4</text>
  <circle cx="560" cy="245" r="5" fill="#2e7d32"/><text x="548" y="249" text-anchor="end" font-size="13" font-weight="700" fill="#14313C">GPIO3</text>
  <circle cx="560" cy="295" r="5" fill="#6a1b9a"/><text x="548" y="299" text-anchor="end" font-size="13" font-weight="700" fill="#14313C">GPIO10</text>
  <circle cx="560" cy="345" r="5" fill="#222"/><text x="548" y="349" text-anchor="end" font-size="13" font-weight="700" fill="#14313C">GND</text>

  <!-- alimentación de la placa -->
  <path d="M180 115 H360" fill="none" stroke="#d32f2f" stroke-width="3"/>
  <path d="M180 165 H360" fill="none" stroke="#222" stroke-width="3"/>
  <!-- riel de 5 V hacia el relé (por arriba) -->
  <circle cx="270" cy="115" r="4" fill="#d32f2f"/>
  <path d="M270 115 V58 H675 V160 H700" fill="none" stroke="#d32f2f" stroke-width="3"/>
  <text x="285" y="52" font-size="11" fill="#d32f2f" font-weight="700">5 V al relé</text>

  <!-- ===== Módulo de relé ===== -->
  <rect x="700" y="90" width="250" height="180" rx="10" fill="#fff4e5" stroke="#14313C" stroke-width="2.5"/>
  <text x="825" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#14313C">Módulo de relé 5 V (1 canal)</text>
  <text x="825" y="133" text-anchor="middle" font-size="11" fill="#14313C">con optoacoplador · contacto seco</text>
  <circle cx="700" cy="160" r="5" fill="#d32f2f"/><text x="712" y="164" font-size="12" font-weight="700" fill="#14313C">VCC</text>
  <circle cx="700" cy="195" r="5" fill="#ef6c00"/><text x="712" y="199" font-size="12" font-weight="700" fill="#14313C">IN</text>
  <circle cx="700" cy="230" r="5" fill="#222"/><text x="712" y="234" font-size="12" font-weight="700" fill="#14313C">GND</text>
  <circle cx="950" cy="160" r="5" fill="#14313C"/><text x="938" y="164" text-anchor="end" font-size="12" font-weight="700" fill="#14313C">COM</text>
  <circle cx="950" cy="195" r="5" fill="#14313C"/><text x="938" y="199" text-anchor="end" font-size="12" font-weight="700" fill="#14313C">NO</text>
  <circle cx="950" cy="230" r="5" fill="#bbb"/><text x="938" y="234" text-anchor="end" font-size="12" fill="#777">NC (sin uso)</text>

  <!-- señal GPIO4 -> IN -->
  <path d="M560 195 H700" fill="none" stroke="#ef6c00" stroke-width="3"/>
  <text x="630" y="187" text-anchor="middle" font-size="11" fill="#ef6c00" font-weight="700">pulso</text>
  <!-- resistencia de seguridad en IN -->
  <circle cx="650" cy="195" r="4" fill="#ef6c00"/>
  <path d="M650 195 V215" fill="none" stroke="#ef6c00" stroke-width="2"/>
  <rect x="642" y="215" width="16" height="34" rx="3" fill="#f5e6c8" stroke="#14313C"/>
  <path d="M650 249 V262" fill="none" stroke="#14313C" stroke-width="2"/>
  <text x="650" y="276" text-anchor="middle" font-size="10" fill="#14313C">a GND o 3V3</text>
  <text x="636" y="236" text-anchor="end" font-size="11" fill="#14313C">10 kΩ</text>
  <!-- GND placa -> relé -->
  <path d="M560 345 H680 V230 H700" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="610" cy="345" r="4" fill="#222"/>

  <!-- ===== Central del portón ===== -->
  <rect x="700" y="420" width="250" height="150" rx="10" fill="#f1f8e9" stroke="#14313C" stroke-width="2.5"/>
  <text x="825" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#14313C">Central del portón / puerta</text>
  <text x="825" y="466" text-anchor="middle" font-size="11" fill="#14313C">bornes del PULSADOR existente</text>
  <circle cx="950" cy="500" r="5" fill="#14313C"/><text x="938" y="504" text-anchor="end" font-size="12" font-weight="700" fill="#14313C">Borne A</text>
  <circle cx="950" cy="535" r="5" fill="#14313C"/><text x="938" y="539" text-anchor="end" font-size="12" font-weight="700" fill="#14313C">Borne B</text>
  <text x="825" y="560" text-anchor="middle" font-size="10" fill="#555">en paralelo con el botón: ambos siguen funcionando</text>
  <!-- NO -> A ; COM -> B -->
  <path d="M950 195 H975 V500 H950" fill="none" stroke="#14313C" stroke-width="3"/>
  <path d="M950 160 H995 V535 H950" fill="none" stroke="#14313C" stroke-width="3"/>
  <text x="1000" y="330" text-anchor="middle" font-size="10" fill="#14313C" transform="rotate(90 1000 330)">cables de contacto seco (sin polaridad)</text>

  <!-- ===== Sensor magnético ===== -->
  <rect x="330" y="450" width="230" height="110" rx="10" fill="#e8f5e9" stroke="#14313C" stroke-width="2"/>
  <text x="445" y="474" text-anchor="middle" font-size="14" font-weight="700" fill="#14313C">Sensor magnético (reed)</text>
  <text x="445" y="491" text-anchor="middle" font-size="11" fill="#14313C">en el marco, con el imán en la hoja</text>
  <rect x="345" y="505" width="80" height="22" rx="4" fill="#ffffff" stroke="#14313C"/><text x="385" y="520" text-anchor="middle" font-size="11" fill="#14313C">contacto</text>
  <rect x="445" y="505" width="55" height="22" rx="4" fill="#ffcc80" stroke="#14313C"/><text x="472" y="520" text-anchor="middle" font-size="11" fill="#14313C">imán</text>
  <text x="445" y="548" text-anchor="middle" font-size="11" fill="#14313C">cerrado = “activo” · abierto = “inactivo”</text>
  <circle cx="560" cy="495" r="4" fill="#2e7d32"/><circle cx="560" cy="525" r="4" fill="#222"/>
  <!-- GPIO3 -> sensor -->
  <path d="M560 245 H590 V495 H560" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <text x="598" y="400" font-size="11" fill="#2e7d32" font-weight="700" transform="rotate(90 598 400)">GPIO3 (pull-up interno)</text>
  <!-- GND -> sensor -->
  <path d="M610 345 V525 H560" fill="none" stroke="#222" stroke-width="3"/>

  <!-- ===== DHT22 opcional ===== -->
  <rect x="30" y="300" width="250" height="170" rx="10" fill="#f3e5f5" stroke="#14313C" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="155" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#14313C">DHT22 (opcional)</text>
  <text x="155" y="341" text-anchor="middle" font-size="11" fill="#14313C">temperatura y humedad</text>
  <text x="48" y="372" font-size="12" fill="#1565c0" font-weight="700">VCC → 3V3</text>
  <text x="48" y="392" font-size="12" fill="#6a1b9a" font-weight="700">DATA → GPIO10</text>
  <text x="48" y="412" font-size="12" fill="#222" font-weight="700">GND → GND</text>
  <text x="48" y="440" font-size="11" fill="#14313C">+ 10 kΩ entre DATA y 3V3</text>
  <text x="48" y="456" font-size="10" fill="#555">(los módulos de 3 pines ya la traen)</text>

  <!-- ===== Notas ===== -->
  <text x="30" y="600" font-size="12" font-weight="700" fill="#14313C">Resistencia de 10 kΩ en IN: a GND si el módulo se activa con nivel ALTO; a 3V3 si se activa con nivel BAJO (así el relé no da un pulso al encender).</text>
  <text x="30" y="620" font-size="12" font-weight="700" fill="#14313C">Seguridad:</text>
  <text x="100" y="620" font-size="11" fill="#14313C">todo es de baja tensión (3,3 V / 5 V). El relé solo cierra un CONTACTO SECO en paralelo con el pulsador: no conectes 220 V al módulo.</text>
  <text x="30" y="640" font-size="11" fill="#14313C">Para una cerradura eléctrica de 12 V usa una fuente propia y un diodo 1N4007 en paralelo con la bobina (ver docs/ESP32-C3-SuperMini.md).</text>
</svg>
