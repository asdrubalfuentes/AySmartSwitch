; aySmartSwitch v2 - ESP32-WROOM-32 (placa generica "esp32dev")
;
; FW_VERSION_OVERRIDE lo inyecta el CI (.github/workflows/release.yml) desde el tag vX.Y.Z;
; sin CI se usa el FW_VERSION de respaldo de src/config.h.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Tabla con dos particiones de aplicacion (OTA) de 1.9 MB cada una
board_build.partitions = min_spiffs.csv
lib_deps =
	bblanchon/ArduinoJson @ ^7.0.4
	knolleary/PubSubClient @ ^2.8
	adafruit/DHT sensor library @ ^1.4.6
	adafruit/Adafruit Unified Sensor @ ^1.1.14
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DMQTT_SOCKET_TIMEOUT=4
	${sysenv.EXTRA_BUILD_FLAGS}
