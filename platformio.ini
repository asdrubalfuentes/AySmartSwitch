; aySmartSwitch v2 - dos placas con el mismo codigo:
;   esp32dev            ESP32-WROOM-32 (placa generica)
;   c3mini              ESP32-C3 SuperMini (USB nativo, 4 MB)
;
; FW_VERSION_OVERRIDE lo inyecta el CI (.github/workflows/release.yml) desde el tag vX.Y.Z;
; sin CI se usa el FW_VERSION de respaldo de src/config.h.

[platformio]
default_envs = c3mini

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Tabla con dos particiones de aplicacion (OTA) de 1.9 MB cada una (sirve para 4 MB de flash)
board_build.partitions = min_spiffs.csv
lib_deps =
	bblanchon/ArduinoJson @ ^7.0.4
	knolleary/PubSubClient @ ^2.8
	adafruit/DHT sensor library @ ^1.4.6
	adafruit/Adafruit Unified Sensor @ ^1.1.14
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DMQTT_SOCKET_TIMEOUT=4
	${sysenv.EXTRA_BUILD_FLAGS}

[env:esp32dev]
board = esp32dev
upload_speed = 921600
build_flags =
	${env.build_flags}
	-DAYS_TARGET_ESP32

[env:c3mini]
board = esp32-c3-devkitm-1
upload_speed = 460800
; El C3 SuperMini no trae chip USB-serie: usa el USB nativo del chip (CDC), que sirve para
; flashear y para el monitor serie.
build_flags =
	${env.build_flags}
	-DAYS_TARGET_ESP32C3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
