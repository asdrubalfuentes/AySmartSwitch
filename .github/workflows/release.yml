# Compila, FIRMA y publica el firmware como GitHub Release "latest".
#
# Disparador: un tag vX.Y.Z sobre main (release aprobado por el mantenedor).
# Publica, por cada placa (esp32 = ESP32-WROOM-32, esp32c3 = ESP32-C3 SuperMini):
#   firmware-<placa>.bin + .sha256 + .sig        y un version.txt comun,
# que los equipos consultan en https://github.com/<owner>/<repo>/releases/latest/download/
# El equipo solo instala el firmware si su firma (ECDSA P-256) valida con la clave publica
# incrustada en src/certs.h. La clave PRIVADA va en el secreto FW_SIGN_KEY del repositorio.

name: Build & Release firmware

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar que el tag pertenece a main
        run: |
          git fetch origin main --depth=100
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El tag ${GITHUB_REF_NAME} no cuelga de main."
            exit 1
          fi

      - name: Extraer version del tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PlatformIO
        run: pip install --upgrade platformio

      - name: Compilar firmware (todas las placas)
        env:
          EXTRA_BUILD_FLAGS: -D FW_VERSION_OVERRIDE=\"${{ steps.version.outputs.version }}\"
        run: pio run -e esp32dev -e c3mini

      - name: Preparar assets
        run: |
          mkdir -p dist
          cp .pio/build/esp32dev/firmware.bin dist/firmware-esp32.bin
          cp .pio/build/c3mini/firmware.bin dist/firmware-esp32c3.bin
          printf '%s' "${{ steps.version.outputs.version }}" > dist/version.txt
          for b in dist/firmware-*.bin; do
            sha256sum "$b" | cut -d' ' -f1 | tr -d '\n' > "${b%.bin}.sha256"
          done

      - name: Firmar firmware
        env:
          FW_SIGN_KEY: ${{ secrets.FW_SIGN_KEY }}
        run: |
          if [ -z "$FW_SIGN_KEY" ]; then echo "::error::Falta el secreto FW_SIGN_KEY (clave privada de firma)."; exit 1; fi
          umask 077
          printf '%s\n' "$FW_SIGN_KEY" > "$RUNNER_TEMP/fw_sign.pem"
          # La clave del secreto debe ser la MISMA cuya publica esta incrustada en el firmware.
          HUELLA=$(openssl ec -in "$RUNNER_TEMP/fw_sign.pem" -pubout -outform DER 2>/dev/null | openssl dgst -sha256 | awk '{print $2}')
          ESPERADA=$(grep -o 'DER): [0-9a-f]*' src/certs.h | awk '{print $2}')
          if [ "$HUELLA" != "$ESPERADA" ]; then echo "::error::FW_SIGN_KEY no corresponde a la clave publica de src/certs.h"; exit 1; fi
          openssl ec -in "$RUNNER_TEMP/fw_sign.pem" -pubout -out "$RUNNER_TEMP/fw_pub.pem" 2>/dev/null
          for b in dist/firmware-*.bin; do
            openssl dgst -sha256 -sign "$RUNNER_TEMP/fw_sign.pem" -out "${b%.bin}.sig" "$b"
            openssl dgst -sha256 -verify "$RUNNER_TEMP/fw_pub.pem" -signature "${b%.bin}.sig" "$b"
            echo "$b  SHA256: $(cat ${b%.bin}.sha256)"
          done
          rm -f "$RUNNER_TEMP/fw_sign.pem"

      - name: Publicar GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          name: "Firmware ${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          make_latest: true
          files: |
            dist/version.txt
            dist/firmware-esp32.bin
            dist/firmware-esp32.sha256
            dist/firmware-esp32.sig
            dist/firmware-esp32c3.bin
            dist/firmware-esp32c3.sha256
            dist/firmware-esp32c3.sig
